[project]
name = "lettuce-greenhouse-gym"
version = "0.1.2"
description = "A Gymnasium environment for the van Henten (1994) lettuce greenhouse climate-control model."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Gürkan Soykan", email = "gurkan.soykan@wur.nl" }
]
requires-python = ">=3.11"
keywords = [
    "greenhouse",
    "gymnasium",
    "reinforcement-learning",
    "model-predictive-control",
    "optimal-control",
    "casadi",
    "van-henten",
    "lettuce",
    "horticulture",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# floors are the lowest versions the test suite passes on (CI job `test-lowest` keeps them honest)
dependencies = [
    "casadi>=3.6.7",
    "gymnasium>=1.0.0",
    "numpy>=2.0",
    "pyyaml>=6.0.2",  # experiment specs and the CLI's --set/--config are YAML
]

[project.optional-dependencies]
# floors: the oldest releases compatible with the core pins above (SB3 < 2.9 caps gymnasium < 1.3;
# SB3 2.9 itself needs torch >= 2.8), never versions chosen from memory
train = [
    "stable-baselines3>=2.9.0",
    "torch>=2.8",
    "tensorboard>=2.20",
    "wandb>=0.24",
]
plot = ["matplotlib>=3.10"]
all = ["lettuce-greenhouse-gym[train,plot]"]

[project.scripts]
lettuce-gym = "lettuce_greenhouse_gym.train.cli:main"

[project.urls]
Homepage = "https://github.com/gsoykan/lettuce-greenhouse-gym"
Repository = "https://github.com/gsoykan/lettuce-greenhouse-gym"
Issues = "https://github.com/gsoykan/lettuce-greenhouse-gym/issues"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
    "mypy>=2.3.1",
]

# --------- pytest --------- #
[tool.pytest.ini_options]
addopts = [
    "--color=yes",
    "--durations=0",
    "--strict-markers",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
log_cli = true
markers = ["slow: slow tests", "network: needs internet access; opt in with LETTUCE_NETWORK_TESTS=1"]
minversion = "6.0"
testpaths = "tests/"

# --------- mypy --------- #
# Backs the `Typing :: Typed` classifier: the public annotations must hold. Run with all extras
# installed (CI job `typecheck`), on Python >= 3.12: NumPy's stubs use `type` statements.
[tool.mypy]
files = ["src/lettuce_greenhouse_gym"]
mypy_path = "typings"  # a permissive stub for casadi, whose shipped stub mypy cannot parse
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# PyYAML ships no type information; stable-baselines3 is optional and may be absent. CasADi is typed
# by the stub under typings/.
module = ["yaml", "stable_baselines3", "stable_baselines3.*"]
ignore_missing_imports = true

# --------- ruff --------- #
[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "S", # flake8-bandit
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "PIE", # flake8-pie
    "PT", # flake8-pytest-style
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # use of assert (needed in tests)
    "B008",   # do not perform function calls in argument defaults
    "RUF012", # mutable class attributes should be annotated with ClassVar
    "RET504", # unnecessary assignment before return
    "N806",   # physics/paper notation: local vars like F, W, T, X0 (van Henten model)
    "N815",   # van Henten parameter names use camelCase by domain convention
]

[tool.ruff.lint.per-file-ignores]
# S603/S607: a test may run `git` with fixed arguments to cross-check the package's own reading of
# .git; the package itself never starts a process
"tests/**/*.py" = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["lettuce_greenhouse_gym"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
