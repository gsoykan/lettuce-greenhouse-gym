default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # The packaged weather trace is a deliberate ~6 MB data file, reviewed and documented in
        # src/lettuce_greenhouse_gym/data/SOURCE.md, and uv.lock is a lockfile that grows past 500 KB.
        # Exempt those rather than raising the global limit, so an accidental large file anywhere
        # else is still caught.
        exclude: ^(src/lettuce_greenhouse_gym/data/|uv\.lock$)
      - id: detect-private-key
      - id: debug-statements
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
